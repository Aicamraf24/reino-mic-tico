name: Compilar Reino Micotico
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      # No hace falta el wrapper: se usa Gradle 9.4.1 directamente
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Compilar
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: reino_micotico-jar
          path: build/libs/*.jar
